<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Fenace Keuangan Logistik</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fenace Kas"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--cy:#29b6f6;--tx:#e7f6ff;--mu:#7aa6c2;--bd:rgba(41,182,246,.3);--red:#ff3b4e;--yel:#ffc23d;--grn:#37e6a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 88% -8%,#0b4a7a99,transparent),radial-gradient(700px 480px at -5% 105%,#07406a77,transparent),#02060b;background-attachment:fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(41,182,246,.04) 0 1px,transparent 1px 3px);pointer-events:none;z-index:1}
h1{font:900 20px/1.1 "Segoe UI",system-ui;letter-spacing:2px;text-transform:uppercase;margin:0;text-shadow:0 0 12px rgba(41,182,246,.7);animation:gl 7s infinite}h1 small{display:block;font-size:11px;letter-spacing:5px;color:var(--cy);font-weight:600;margin-top:4px}
@keyframes gl{0%,92%,100%{text-shadow:0 0 12px rgba(41,182,246,.7);transform:none}93%{text-shadow:-3px 0 #ff3b4e,3px 0 #29b6f6;transform:translateX(1px)}95%{text-shadow:3px 0 #ff3b4e,-3px 0 #29b6f6;transform:translateX(-1px)}97%{transform:none}}
h2{font:900 21px system-ui;letter-spacing:1px;text-transform:uppercase;margin:0 0 12px}h3{font:800 14px system-ui;letter-spacing:1.5px;text-transform:uppercase;color:var(--cy);margin:0 0 6px}p{margin:6px 0}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:1000px;margin:auto;position:relative;z-index:2}.hd img{height:52px;border-radius:6px}
main{max-width:1000px;margin:auto;padding:8px 14px;position:relative;z-index:2}
.card{background:rgba(6,22,36,.72);border:1px solid var(--bd);border-left:3px solid var(--cy);border-radius:6px;padding:14px;margin:0 0 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 24px rgba(41,182,246,.06)}
.alert{border-color:var(--red);border-left-color:var(--red);animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 22px rgba(255,59,78,.4),inset 0 0 24px rgba(255,59,78,.1)}}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g2 .card{margin:0}
.btn{border:0;background:linear-gradient(135deg,#46c8ff,#0a84d6);color:#00131f;font:800 14px system-ui;letter-spacing:1px;text-transform:uppercase;padding:14px 18px;min-height:48px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.g{background:rgba(41,182,246,.14);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd)}.btn.r{background:linear-gradient(135deg,#ff6a78,#d41f33);color:#fff}.btn.s{min-height:38px;padding:7px 14px;font-size:12px}
.qb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.qb .btn{padding:22px 8px;font-size:16px}
input,select,textarea{width:100%;font:16px system-ui;color:var(--tx);background:rgba(0,12,22,.8);border:1px solid var(--bd);border-radius:4px;padding:12px;min-height:46px;margin-top:4px}option{color:#000}
label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(41,182,246,.14);cursor:pointer}.rw:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.pb{height:8px;background:rgba(41,182,246,.14);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:linear-gradient(90deg,#0a84d6,#46c8ff)}
.pos{color:var(--grn)}.neg{color:var(--red)}.nw{font:900 34px "Cascadia Mono",Consolas,Menlo,monospace;color:var(--cy);text-shadow:0 0 14px rgba(41,182,246,.6)}.cd{font:900 42px "Cascadia Mono",Consolas,monospace;color:var(--yel)}.cd small{font-size:14px;color:var(--mu)}.alert .cd{color:var(--red)}
.st{display:inline-block;padding:5px 11px;font-size:12px;font-weight:700;border-radius:3px}.st.ok{background:rgba(55,230,160,.15);color:var(--grn)}.st.w{background:rgba(255,194,61,.15);color:var(--yel)}.st.b{background:rgba(255,59,78,.15);color:var(--red)}button.st{border:0;font-family:inherit;cursor:pointer;text-align:left}
.seg{display:flex;gap:6px;margin:6px 0 12px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.chip{border:1px solid var(--bd);background:rgba(41,182,246,.1);color:var(--tx);padding:9px 14px;font:700 13px system-ui;min-height:40px;border-radius:3px}.chip.on{background:var(--cy);color:#00131f}
.big{font:900 32px "Cascadia Mono",Consolas,monospace!important;text-align:right;color:var(--cy)!important}.acts{display:flex;gap:10px;margin-top:10px}.acts .btn{flex:1}
.hj{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}.hj b{flex:1;text-align:center;color:var(--cy)}
.ln{border:1px solid var(--bd);padding:8px;margin-bottom:8px;border-radius:4px}.lr{display:flex;gap:6px;align-items:center;margin-top:6px}.lr input,.lr select{margin:0;min-width:0}.tot{font:800 18px system-ui;text-align:right;margin:6px 0 10px;color:var(--cy)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid rgba(41,182,246,.18);text-align:left}th{color:var(--cy);font-size:11px;letter-spacing:1px;text-transform:uppercase}td.n,th.n{text-align:right}.sc{overflow-x:auto}.fb{display:flex;gap:8px;flex-wrap:wrap}.fb>*{flex:1 1 140px;margin:0}
#sh,#lk{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}#sh[hidden],#lk[hidden],#tt[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:93vh;overflow:auto;background:#04121d;border:1px solid var(--bd);border-top:2px solid var(--cy);border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#lk{z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:#02060b}#lk input{max-width:260px;text-align:center;font-size:24px}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;background:#e7f6ff;color:#00131f;padding:12px 16px;border-radius:4px;font-weight:700;display:flex;gap:12px;align-items:center;max-width:92vw}#tt button{border:0;background:#0a84d6;color:#fff;padding:6px 12px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(2,8,14,.95);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:700 11px system-ui;letter-spacing:1px;text-transform:uppercase;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}nav button span{font-size:19px}nav button.on{color:var(--cy);text-shadow:0 0 10px rgba(41,182,246,.8)}
#by{position:fixed;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;background:rgba(2,6,11,.88);color:var(--cy);border:1px solid var(--cy);font:800 11px system-ui;letter-spacing:1px;padding:5px 11px;border-radius:3px;box-shadow:0 0 12px rgba(41,182,246,.5);pointer-events:none}
#intro{cursor:pointer;position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}#intro.out{opacity:0;pointer-events:none}#intro video,#intro img{width:100%;height:100%;object-fit:contain}#intro .sk{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));color:var(--mu);font:700 11px system-ui;letter-spacing:3px;text-transform:uppercase}#intro [hidden]{display:none}
.rep{background:rgba(6,22,36,.72)}.sig{display:flex;justify-content:space-around;margin-top:30px;text-align:center}.sig i{display:block;height:54px}
@media(min-width:800px){body{padding-bottom:50px}nav{position:sticky;top:0;bottom:auto;max-width:1000px;margin:6px auto;border:1px solid var(--bd);border-radius:4px}nav button{flex-direction:row;justify-content:center;font-size:13px;gap:8px}#by{bottom:12px;z-index:30}#sh{align-items:center}.sheet{border-radius:14px}}
.ln.unk{border-color:var(--yel)}.ln .uk{display:none;color:var(--yel);font-size:12px;margin-top:4px}.ln.unk .uk{display:block}
#intro{flex-direction:column;gap:14px}#intro .iv{width:100%;max-width:900px;aspect-ratio:16/9;max-height:62vh}#intro video,#intro img{width:100%;height:100%;object-fit:contain}#ip{width:min(300px,80vw);display:flex;flex-direction:column;align-items:center;gap:10px}#ip[hidden]{display:none}#ip input{text-align:center;font-size:24px;border:2px solid var(--cy);box-shadow:0 0 18px rgba(41,182,246,.55),inset 0 0 12px rgba(41,182,246,.12);caret-color:var(--cy);margin:0}#ip input:focus{outline:none;box-shadow:0 0 28px rgba(41,182,246,.85),inset 0 0 12px rgba(41,182,246,.18)}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media print{body{background:#fff;color:#000;padding:0}body::before,nav,#by,.hd,.noprint,.btn{display:none!important}.card,.rep{background:#fff;border:1px solid #999;color:#000;box-shadow:none;break-inside:avoid}.mu,h3,th{color:#333}.pos,.neg,.nw{color:#000;text-shadow:none}}
</style></head><body>

<div class="hd"><img id="lg" alt="logo"><h1>Fenace Keuangan<small>LOGISTIK</small></h1></div>

const row=t=>'<div class="rw" data-a="etx" data-i="'+t.id+'"><div><b>'+E(t.y=='in'?(t.n||'Uang dari TU'):t.n+(t.q>1?' x'+t.q:''))+'</b><div class="mu">'+F(t.d)+' &middot; '+hs(H(t))+(t.y=='out'?' &middot; '+E(CAT[t.c])+(t.t?' &middot; '+E(t.t):''):'')+(t.y=='out'&&!t.nota?' <span class="st b">tanpa nota</span>':'')+'</div></div><b class="'+(t.y=='in'?'pos':'neg')+'">'+(t.y=='in'?'+':'-')+R(t.a)+'</b></div>';
function vHome(){const{P,n}=dleft(),a=P.y*12+P.t*3,cur=db.tx.filter(t=>{const k=mi(t);return k>=a&&k<=a+2}),inc=sum(cur.filter(t=>t.y=='in'),t=>t.a),out=sum(cur.filter(t=>t.y=='out'),t=>t.a),sa=saldo(),nn=db.tx.filter(t=>t.y=='out'&&!t.nota).length,by={};
 cur.filter(t=>t.y=='out').forEach(t=>by[t.c]=(by[t.c]||0)+t.a);const age=db.bk?(Date.now()-db.bk)/864e5:99,same=db.bk&&iso(new Date(db.bk))==TD();
 return qb+'<div class="card noprint">'+(same?'<span class="st ok">Cadangan hari ini sudah ada</span>':'<button class="st '+(age<7?'w':'b')+'" data-a="tab" data-i="set">'+(db.bk?'Cadangan terakhir '+F(iso(new Date(db.bk)))+'. Ketuk untuk cadangkan':'Belum pernah dicadangkan. Ketuk untuk cadangkan')+'</button>')+'</div><div class="g2"><div class="card"><div class="mu">SALDO KAS SAAT INI</div><div class="nw '+(sa<0?'neg':'')+'">'+R(sa)+'</div><div class="mu">'+hs(hij(TD()))+' &middot; '+F(TD())+'</div></div>'+
 '<div class="card '+(n<=14?'alert':'')+'"><h3>LPJ Triwulan '+(P.t+1)+' &middot; '+P.y+' H</h3><div class="mu">'+tl(P.t)+'</div><div class="cd">'+n+'<small> hari lagi</small></div><div class="mu">Masuk '+R(inc)+' &middot; Belanja '+R(out)+'</div><div style="margin-top:8px"><button class="btn s" data-a="tab" data-i="lpj">Buka LPJ</button></div></div>'+
 '<div class="card"><h3>Belanja triwulan ini</h3>'+(CK.map(k=>by[k]?'<div style="margin-top:8px"><div style="display:flex;justify-content:space-between"><span>'+CAT[k]+'</span><b>'+R(by[k])+'</b></div><div class="pb"><i style="width:'+by[k]/out*100+'%"></i></div></div>':'').join('')||'<p class="mu">Belum ada belanja.</p>')+(nn?'<p><span class="st b">'+nn+' belanja tanpa nota</span></p>':'')+'</div>'+
 '<div class="card"><h3>Terakhir dicatat</h3>'+(txs().slice(-6).reverse().map(row).join('')||'<p class="mu">Belum ada catatan. Mulai dengan + Uang masuk dari TU.</p>')+'</div></div>'}
function periods(){const s=new Set(db.tx.map(t=>{const h=H(t);return h.y*12+h.m-1}));return[...s].sort((a,b)=>b-a)}
const pl=k=>HM[k%12]+' '+Math.floor(k/12);
function vHis(){return qb+'<div class="card noprint"><input id="fq" placeholder="Cari barang, toko, keterangan..." value="'+E(fl.q)+'"><div class="fb" style="margin-top:8px">'+sel('fy',[['','Semua jenis'],['in','Uang masuk'],['out','Belanja']],fl.y)+sel('fc',[['','Semua kategori'],...CK.map(k=>[k,CAT[k]])],fl.c)+sel('fp',[['','Semua bulan'],...periods().map(k=>[k,pl(k)+' H'])],fl.p)+'</div></div><div class="card"><div class="rw" style="cursor:default;border:0"><h3 id="hc" style="margin:0"></h3><button class="btn s g noprint" data-a="csv">Ekspor Excel (.xlsx)</button></div><div id="lst"></div></div>'}
function fillList(){const q=fl.q.toLowerCase(),l=txs().filter(t=>(!fl.y||t.y==fl.y)&&(!fl.c||t.c==fl.c)&&(fl.p===''||mi(t)==fl.p)&&(!q||(t.n+' '+(t.t||'')+' '+(t.b||'')).toLowerCase().includes(q))).reverse();
 $('#hc').textContent=l.length+' catatan, masuk '+R(sum(l.filter(t=>t.y=='in'),t=>t.a))+', belanja '+R(sum(l.filter(t=>t.y=='out'),t=>t.a));$('#lst').innerHTML=l.map(row).join('')||'<p class="mu">Tidak ada catatan yang cocok.</p>'}
/* LPJ */
function lpjData(a,b){const ms=[];for(let k=a;k<=b;k++){const T=db.tx.filter(t=>mi(t)==k),I=T.filter(t=>t.y=='in'),O=T.filter(t=>t.y=='out');ms.push({k,I,O,in:sum(I,t=>t.a),out:sum(O,t=>t.a)})}
 let s=(+db.set.sal||0)+sum(db.tx.filter(t=>mi(t)<a),t=>t.y=='in'?t.a:-t.a);ms.forEach(m=>{m.aw=s;s+=m.in-m.out;m.ak=s});return ms}
function vLpj(){const d=dleft().P;LP=LP||d;const P=LP,a=P.y*12+P.t*3,ms=lpjData(a,a+2),ct={};ms.forEach(m=>m.O.forEach(t=>ct[t.c]=(ct[t.c]||0)+t.a));
 return '<div class="card noprint"><div class="fb">'+sel('lt',[0,1,2,3].map(t=>[t,'Triwulan '+(t+1)+' ('+tl(t)+')']),P.t)+'<input id="ly" type="number" value="'+P.y+'" min="1300" max="1700"></div></div><div class="card rep"><h2 style="margin-bottom:2px">Laporan Pertanggungjawaban (LPJ)</h2><div class="mu">Triwulan '+(P.t+1)+' &middot; '+tl(P.t)+' '+P.y+' H<br>Pemegang kas: '+E(db.set.nama||'-')+' '+E(db.set.jab||'')+'</div><div class="sc" style="margin-top:12px"><table><tr><th>Bulan</th><th class="n">Saldo awal</th><th class="n">Pemasukan</th><th class="n">Pengeluaran</th><th class="n">Saldo akhir</th></tr>'+ms.map(m=>'<tr><td>'+HM[m.k%12]+'</td><td class="n">'+R(m.aw)+'</td><td class="n">'+R(m.in)+'</td><td class="n">'+R(m.out)+'</td><td class="n">'+R(m.ak)+'</td></tr>').join('')+'<tr><th>Total</th><th class="n">'+R(ms[0].aw)+'</th><th class="n">'+R(sum(ms,m=>m.in))+'</th><th class="n">'+R(sum(ms,m=>m.out))+'</th><th class="n">'+R(ms[2].ak)+'</th></tr></table></div><div class="noprint" style="margin-top:14px;padding:12px;border:1px solid var(--bd);border-left:3px solid var(--cy);border-radius:6px"><div class="chips"><button class="btn" data-a="xl3">Ekspor Excel (.xlsx) triwulan ini</button><button class="btn g" data-a="xly">Ekspor Excel 1 tahun (.xlsx)</button><button class="btn g" data-a="prn">Cetak (A4)</button></div><p class="mu">File .xlsx (template LPJ KARYAWAN): satu sheet per bulan Hijriyah, ditambah sheet REKAP LPJ.</p></div><h3 style="margin-top:14px">Pengeluaran per kategori</h3>'+CK.map(k=>'<div class="rw" style="cursor:default"><span>'+CAT[k]+'</span><b>'+R(ct[k]||0)+'</b></div>').join('')+
 ms.map(m=>m.I.length+m.O.length?'<h3 style="margin-top:14px">'+HM[m.k%12]+' '+Math.floor(m.k/12)+' H</h3><div class="sc"><table><tr><th>Tgl</th><th>Uraian</th><th class="n">Masuk</th><th class="n">Keluar</th></tr>'+m.I.concat(m.O).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.id-y.id).map(t=>'<tr><td>'+H(t).d+'</td><td>'+E(t.y=='in'?(t.n||'Uang dari TU'):t.n+(t.q>1?' x'+t.q:'')+' ('+CAT[t.c].split(' ')[0]+')')+'</td><td class="n">'+(t.y=='in'?R(t.a):'')+'</td><td class="n">'+(t.y=='out'?R(t.a):'')+'</td></tr>').join('')+'</table></div>':'').join('')+
 '<div class="sig"><div>Pemegang kas<i></i>('+E(db.set.nama||'..............')+')</div><div>Menerima (TU)<i></i>('+E(db.set.tu||'..............')+')</div></div></div>'}
function vSet(){const s=db.set;return '<div class="card"><h3>Data pemegang kas</h3><div class="rw" data-a="prof"><div><b>'+E(s.nama||'Belum diisi')+'</b><div class="mu">'+E(s.jab||'-')+' &middot; TU: '+E(s.tu||'-')+'</div></div><span class="mu">ubah</span></div><div class="rw" data-a="sal"><div><b>Saldo awal kas</b><div class="mu">Sisa uang sebelum pencatatan dimulai</div></div><b>'+R(s.sal)+'</b></div><div class="rw" data-a="intro"><div><b>Suara animasi pembuka</b><div class="mu">Di iPhone perlu 1 ketukan dulu agar suaranya bisa jalan</div></div><b>'+(s.intro=='senyap'?'Mati':'Hidup')+'</b></div><div class="rw" data-a="off"><div><b>Koreksi tanggal Hijriyah</b><div class="mu">Kalau beda 1 hari dengan kalender madrasah</div></div><b>'+(s.off>0?'+':'')+s.off+' hari</b></div></div><div class="card"><h3>Cadangan dan keamanan</h3><div class="chips"><button class="btn s" data-a="bk">Unduh cadangan</button><button class="btn s g" data-a="rst">Pulihkan dari file</button><button class="btn s g" data-a="pin">'+(s.pin?'Ubah / matikan PIN':'Atur PIN')+'</button></div><p class="mu">Data hanya ada di perangkat ini dan tidak dikirim ke internet. Kalau data browser dibersihkan atau aplikasi dihapus, data hilang, jadi cadangkan rutin, terutama sebelum setor LPJ. PIN hanya pencegah akses iseng, bukan enkripsi.</p></div>'}
