<style>
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
:root{--bg:linear-gradient(135deg,#03120d,#0a3a2a 55%,#241d08);--glow:radial-gradient(700px 420px at 92% -8%,rgba(230,195,100,.25),transparent),radial-gradient(700px 460px at -6% 104%,rgba(31,138,91,.4),transparent);--card:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.04));--tx:#f8f3df;--mu:#a8c7b3;--line:rgba(230,195,100,.3);--gold:linear-gradient(135deg,#f6e3a1,#d9ab3e 55%,#a87a1e);--dk:#0d3d2b;--ok:#3fd08f;--mint:#46dc98;--bad:#ff5a5a;--warn:#ffc23d;--side:#04120c;--frame:rgba(255,255,255,.04)}
[data-theme=light]{--bg:linear-gradient(135deg,#d9f0e3,#f3eed6);--glow:radial-gradient(700px 420px at 92% -8%,rgba(217,171,62,.3),transparent),radial-gradient(700px 460px at -6% 104%,rgba(63,208,143,.3),transparent);--card:rgba(248,243,223,.82);--tx:#12271d;--mu:#587a67;--line:rgba(168,122,30,.35);--frame:rgba(255,255,255,.35)}
html{background:#03120d}[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-theme=light]{background:#e6f1df}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--glow),var(--bg) fixed;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.frame{display:grid;grid-template-columns:72px minmax(0,1fr) 340px;gap:16px;padding:16px;border-radius:32px;background:var(--frame);border:1px solid var(--line);min-height:calc(100vh - 32px)}
.side{position:sticky;top:16px;align-self:start;height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;border-radius:36px;background:var(--side);border:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:50%;padding:2px;background:var(--gold);box-shadow:0 0 18px rgba(217,171,62,.45);margin-bottom:10px;overflow:hidden;flex:none}.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scale(1.68);display:block}
.ni{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#a8c7b3;transition:.25s}
.ni svg,.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ni:hover{transform:scale(1.12);color:#f8f3df}.ni.on{background:#f8f3df;color:#0d3d2b}
.ni span{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:#000;color:#fff;font-size:12px;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.ni:hover span{opacity:1}.sp{flex:1}
main{min-width:0;display:flex;flex-direction:column;gap:16px;transition:filter .35s,opacity .35s}main.sk{filter:blur(14px);opacity:.5}
.hero{border-radius:28px;padding:22px 26px;background:linear-gradient(135deg,#0d3d2b,#0a2a1f);border:1px solid var(--line);color:#f8f3df;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
.hero h1{margin:0;font-size:clamp(24px,3.2vw,38px);font-weight:600;letter-spacing:-.5px;line-height:1.1}.hero p{margin:6px 0 0;color:#a8c7b3;font-size:13px;max-width:380px}
.av{display:flex;align-items:center}.av i{width:34px;height:34px;border-radius:50%;margin-left:-10px;border:2px solid #0d3d2b;display:grid;place-items:center;font:700 12px system-ui;font-style:normal;color:#1a1403;background:var(--gold)}.av i:first-child{margin:0;background:#46dc98}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px}.pill b{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:99px;background:var(--gold);color:#1a1403;font-weight:800;box-shadow:0 6px 22px rgba(217,171,62,.35);transition:.25s}.btn:hover{transform:translateY(-2px)}
.row{display:grid;gap:16px}.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.r2{grid-template-columns:1.5fr 1fr}
.card{border-radius:24px;padding:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.ct{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px;margin-bottom:12px}.ct .ic{width:16px;height:16px}
.big{font:800 clamp(28px,3vw,40px)/1 system-ui;letter-spacing:-1px}.sm{color:var(--mu);font-size:12px}

function lpjMonth(y,m){const k=y*12+m,I=db.tx.filter(t=>t.y=='in'&&hk(t)==k).sort(cmpD),O=db.tx.filter(t=>t.y=='out'&&hk(t)==k).sort(cmpD),U=HN[m].toUpperCase();
